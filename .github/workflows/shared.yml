name: Shared check

# ga4, gsc and sitepulse keep identical copies of src/shared/, test/shared/
# and scripts/check-shared.mjs. This fails when this repository's main and a
# sibling's main differ. It does not run on pull requests: a shared change
# lands in all the repositories, and until the last one is merged the others
# fail here, which is expected. The weekly run catches a change made in a
# sibling after this repository last ran.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-shared.mjs
